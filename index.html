<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Volumetric Contours - Quest 3 WebXR</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #06070a;
      width: 100%;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      display: block;
    }
    #ui-hud {
      position: absolute;
      top: 16px;
      left: 16px;
      color: rgba(255, 255, 255, 0.9);
      background: rgba(14, 15, 22, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 14px 18px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      pointer-events: none;
      z-index: 10;
      max-width: 320px;
      font-size: 13px;
      line-height: 1.5;
    }
    #ui-hud h2 {
      margin: 0 0 6px 0;
      font-size: 15px;
      color: #79c0ff;
    }
    #ui-hud span.val {
      color: #f7a844;
      font-weight: 600;
    }
    #vr-btn {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      padding: 14px 28px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #fff;
      background: #1c64f2;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      cursor: pointer;
      z-index: 100;
      transition: background 0.2s, transform 0.1s;
    }
    #vr-btn:active {
      transform: translateX(-50%) scale(0.96);
      background: #1a56db;
    }
    #err-banner {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      background: #e02424;
      color: #fff;
      font-size: 12px;
      padding: 8px 16px;
      display: none;
      z-index: 1000;
    }
  </style>

  <!-- Production Three.js UMD (Zero import maps / no module loader failure) -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
</head>
<body>
  <div id="err-banner"></div>

  <div id="ui-hud">
    <h2>💎 K1 Sacred Chamber (Quest 3)</h2>
    Status: <span id="status-val" class="val">2D Browser Preview</span><br>
    Hardware: <span id="hw-val" class="val">Ready</span><br>
    Span: <span id="span-val" class="val">0.50m</span> | Pinch: <span id="pinch-val" class="val">0.00</span>
  </div>

  <button id="vr-btn">ENTER VR</button>
  <div id="canvas-container"></div>

  <script>
    // Global error handler for display on the Quest screen
    window.addEventListener('error', (e) => {
      const banner = document.getElementById('err-banner');
      banner.style.display = 'block';
      banner.textContent = 'Error: ' + e.message;
    });

    const statusVal = document.getElementById('status-val');
    const hwVal = document.getElementById('hw-val');
    const spanVal = document.getElementById('span-val');
    const pinchVal = document.getElementById('pinch-val');
    const vrBtn = document.getElementById('vr-btn');

    // 1. Scene & Setup
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 0.1);

    const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
    renderer.setPixelRatio(1.0); // 1.0 DPR maintains 72-90 FPS on Snapdragon XR2
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    container.appendChild(renderer.domElement);

    // 2. Geometry & Shader (DoubleSide ensures it is never culled)
    const domeGeo = new THREE.SphereGeometry(60, 48, 24);

    const vertexShader = `
      varying vec3 vDirection;
      void main() {
        // Pass model position directly as the sphere direction vector
        vDirection = position;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `;

    const fragmentShader = `
      precision highp float;
      varying vec3 vDirection;

      uniform float u_time;
      uniform float u_flow_angle;
      uniform float u_speed;
      uniform float u_warp_scale;
      uniform float u_flow_stretch;
      uniform float u_kaleido_segs;
      uniform float u_kaleido_angle;
      uniform float u_contour_freq;
      uniform float u_ridge_weight;
      uniform float u_chroma_aberration;
      uniform float u_specular_shimmer;
      uniform float u_rim_glow;
      uniform float u_contrast;

      uniform vec2 u_hand_impulse;
      uniform float u_pinch_force;
      uniform float u_hand_span;

      uniform vec3 u_col_shadow;
      uniform vec3 u_col_cool_a;
      uniform vec3 u_col_cool_b;
      uniform vec3 u_col_warm_a;
      uniform vec3 u_col_warm_b;
      uniform vec3 u_col_crest;

      vec2 hash(vec2 p) {
        p = vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3)));
        return -1.0 + 2.0 * fract(sin(p) * 43758.5453123);
      }

      float noise(vec2 p) {
        const float K1 = 0.366025404;
        const float K2 = 0.211324865;
        vec2 i = floor(p + (p.x + p.y) * K1);
        vec2 a = p - i + (i.x + i.y) * K2;
        vec2 o = (a.x > a.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
        vec2 b = a - o + K2;
        vec2 c = a - 1.0 + 2.0 * K2;
        vec3 h = max(0.5 - vec3(dot(a, a), dot(b, b), dot(c, c)), 0.0);
        vec3 n = h * h * h * h * vec3(dot(a, hash(i + 0.0)), dot(b, hash(i + o)), dot(c, hash(i + 1.0)));
        return dot(n, vec3(70.0));
      }

      float fbm(vec2 p) {
        float f = 0.0;
        float amp = 0.52;
        mat2 rot = mat2(cos(0.26), sin(0.26), -sin(0.26), cos(0.26));
        for (int i = 0; i < 4; i++) {
          f += amp * noise(p);
          p = rot * p * 1.82;
          amp *= 0.52;
        }
        return f;
      }

      vec4 hexCoords(vec2 uv) {
        const vec2 s = vec2(1.0, 1.7320508);
        vec4 hC = floor(vec4(uv, uv - vec2(0.5, 1.0)) / vec4(s, s)) + 0.5;
        vec4 h = vec4(uv - hC.xy * s, uv - (hC.zw + 0.5) * s);
        return dot(h.xy, h.xy) < dot(h.zw, h.zw) ? vec4(h.xy, hC.xy) : vec4(h.zw, hC.zw + 9.73);
      }

      float flowerOfLife(vec2 p) {
        vec4 h = hexCoords(p * 2.2);
        vec2 pCell = h.xy;
        float circleR = 1.0;
        float d1 = abs(length(pCell) - circleR);
        float d2 = abs(length(pCell - vec2(1.0, 0.0)) - circleR);
        float d3 = abs(length(pCell + vec2(1.0, 0.0)) - circleR);
        float d4 = abs(length(pCell - vec2(0.5, 0.866025)) - circleR);
        float d5 = abs(length(pCell + vec2(0.5, 0.866025)) - circleR);
        float d6 = abs(length(pCell - vec2(-0.5, 0.866025)) - circleR);
        float d7 = abs(length(pCell + vec2(-0.5, 0.866025)) - circleR);
        float minD = min(min(min(d1, d2), min(d3, d4)), min(min(d5, d6), d7));
        return 1.0 - smoothstep(0.04, 0.12, minD);
      }

      vec3 rhombilleDiamonds(vec2 p) {
        vec2 s = vec2(1.7320508, 1.0);
        vec2 a = mod(p, s) - s * 0.5;
        vec2 b = mod(p - s * 0.5, s) - s * 0.5;
        vec2 g = dot(a, a) < dot(b, b) ? a : b;

        // Safe atan to prevent Adreno GPU NaN crash
        float angle = atan(g.y, g.x + 1e-5) + 3.14159265;
        float sector = floor(mod(angle / 1.04719755, 6.0));
        float facetID = mod(sector, 3.0);
        vec2 diamondUV = abs(g);
        float dEdge = max(diamondUV.x * 0.5 + diamondUV.y * 0.866025, diamondUV.x);
        float wire = 1.0 - smoothstep(0.44, 0.49, dEdge);
        return vec3(facetID, wire, dEdge);
      }

      void main() {
        vec3 ray = normalize(vDirection);

        // Safe acos & safe atan
        float polarDist = acos(clamp(-ray.z, -0.9999, 0.9999));
        float polarAngle = atan(ray.y, ray.x + 1e-5) + u_kaleido_angle;

        float tau = 6.28318530718;
        float segAngle = tau / max(u_kaleido_segs, 1.0);
        float modA = mod(polarAngle, segAngle);
        if (modA < 0.0) modA += segAngle;
        float foldA = abs(modA - segAngle * 0.5);

        vec2 st = vec2(cos(foldA), sin(foldA)) * polarDist * 1.4;
        st += u_hand_impulse * 0.35;

        float dynamicStretch = u_flow_stretch * (0.8 + u_hand_span * 0.4);
        float t = u_time * u_speed;
        float rad = u_flow_angle;
        mat2 alignFlow = mat2(cos(rad), sin(rad), -sin(rad), cos(rad));
        vec2 p = alignFlow * st * vec2(0.55, dynamicStretch);

        float radDist = length(p);
        float angleP = atan(p.y, p.x + 1e-5);
        vec2 kDistort = vec2(fbm(p * 1.8 + t * 0.15), fbm(p * 1.8 - t * 0.12)) * (u_warp_scale * 0.22);
        vec2 kp = p + kDistort;

        vec3 rBlocks = rhombilleDiamonds(kp * 4.2);
        float centerMask = 1.0 - smoothstep(0.45, 0.85, radDist);
        float facetShade = (rBlocks.x < 0.5) ? 0.95 : ((rBlocks.x < 1.5) ? 0.65 : 0.40);

        float fol = flowerOfLife(kp * 1.8);
        float ringWaves = abs(sin(radDist * 24.0 - t * 1.2 + sin(angleP * 12.0) * 0.4));
        float chevrons = abs(sin(angleP * 24.0 + radDist * 16.0));
        float beads = 1.0 - smoothstep(0.12, 0.28, length(fract(vec2(angleP * 3.82, radDist * 6.0)) - 0.5));
        float filigreeLace = max(fol * 0.8, chevrons * 0.5) + ringWaves * 0.4 + beads * 0.5;

        float f = mix(filigreeLace, facetShade * 1.2 + rBlocks.y * 0.6, centerMask);
        vec2 r = vec2(cos(angleP), sin(angleP)) * f;

        float freq = u_contour_freq;
        float chroma = u_chroma_aberration * 0.22;
        float ridgeR = abs(sin(f * freq + (r.x + r.y) * 1.5 + chroma));
        float ridgeG = abs(sin(f * freq + (r.x + r.y) * 1.5));
        float ridgeB = abs(sin(f * freq + (r.x + r.y) * 1.5 - chroma));
        vec3 ridges = vec3(smoothstep(0.65, 0.95, ridgeR), smoothstep(0.65, 0.95, ridgeG), smoothstep(0.65, 0.95, ridgeB));
        float bands = smoothstep(0.15, 0.85, sin(f * (freq * 0.45) + r.x * 2.5));

        vec3 normalPerturb = vec3(sin(rBlocks.z * 18.0), cos(rBlocks.z * 18.0), 0.0) * centerMask * 0.85;
        vec3 normal = normalize(vec3(-r.x * 1.8, -r.y * 1.8, 0.75) + normalPerturb);
        vec3 lightDir = normalize(vec3(0.35, 0.85, 0.45));
        vec3 viewDir = -ray;
        vec3 halfVec = normalize(lightDir + viewDir);
        float spec = pow(max(dot(normal, halfVec), 0.0), 22.0) * u_specular_shimmer;
        float fresnel = pow(clamp(1.0 - max(dot(normal, viewDir), 0.0), 0.0, 1.0), 3.0) * u_rim_glow;

        vec3 col = mix(u_col_shadow, u_col_cool_a, clamp((f * f) * (3.2 * u_contrast), 0.0, 1.0));
        col = mix(col, u_col_cool_b, clamp(length(kDistort) * 0.9 + 0.35, 0.0, 1.0));
        col = mix(col, u_col_warm_b, clamp(r.x * r.x * (2.2 * u_contrast), 0.0, 1.0));
        col = mix(col, u_col_warm_a, clamp(r.y * 1.4, 0.0, 1.0));

        col += (u_col_crest * bands * 0.18) + (ridges * u_col_crest * u_ridge_weight);
        col += u_col_crest * spec * 1.4;
        col += mix(u_col_cool_b, u_col_crest, 0.65) * fresnel;
        col += vec3(0.3, 0.8, 1.0) * u_pinch_force * 0.7;

        col *= (0.75 + 0.45 * f * u_contrast);

        gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
      }
    `;

    // Uniforms configured to the K1 preset
    const uniforms = {
      u_time:              { value: 0.0 },
      u_flow_angle:        { value: (74.0 * Math.PI) / 180.0 },
      u_speed:             { value: 1.00 },
      u_warp_scale:        { value: 0.90 },
      u_flow_stretch:      { value: 0.35 },
      u_kaleido_segs:      { value: 6.0 },
      u_kaleido_angle:     { value: (30.0 * Math.PI) / 180.0 },
      u_contour_freq:      { value: 22.0 },
      u_ridge_weight:      { value: 0.38 },
      u_chroma_aberration: { value: 0.46 },
      u_specular_shimmer:  { value: 0.85 },
      u_rim_glow:          { value: 0.40 },
      u_contrast:          { value: 1.10 },

      u_hand_impulse:      { value: new THREE.Vector2(0.0, 0.0) },
      u_pinch_force:       { value: 0.0 },
      u_hand_span:         { value: 0.5 },

      u_col_shadow:        { value: new THREE.Color('#1c1412') },
      u_col_cool_a:        { value: new THREE.Color('#7e5234') },
      u_col_cool_b:        { value: new THREE.Color('#df7b6c') },
      u_col_warm_a:        { value: new THREE.Color('#2b7cd4') },
      u_col_warm_b:        { value: new THREE.Color('#4e999b') },
      u_col_crest:         { value: new THREE.Color('#ffffff') }
    };

    const domeMat = new THREE.ShaderMaterial({
      vertexShader: vertexShader,
      fragmentShader: fragmentShader,
      uniforms: uniforms,
      side: THREE.DoubleSide, // Guarantees the geometry is visible regardless of winding
      depthWrite: false
    });

    const skyDome = new THREE.Mesh(domeGeo, domeMat);
    scene.add(skyDome);

    // 3. Simple Visual Indicators for Controllers/Hands
    const controller1 = renderer.xr.getController(0);
    const controller2 = renderer.xr.getController(1);
    scene.add(controller1);
    scene.add(controller2);

    const pointerGeo = new THREE.SphereGeometry(0.025, 12, 12);
    const pointerMat1 = new THREE.MeshBasicMaterial({ color: 0x2b7cd4, wireframe: true });
    const pointerMat2 = new THREE.MeshBasicMaterial({ color: 0xdf7b6c, wireframe: true });
    controller1.add(new THREE.Mesh(pointerGeo, pointerMat1));
    controller2.add(new THREE.Mesh(pointerGeo, pointerMat2));

    const hand1 = renderer.xr.getHand ? renderer.xr.getHand(0) : null;
    const hand2 = renderer.xr.getHand ? renderer.xr.getHand(1) : null;
    if (hand1) scene.add(hand1);
    if (hand2) scene.add(hand2);

    // 4. Fallback 2D Drag-To-Look Controls
    let isDragging = false;
    let prevX = 0, prevY = 0;
    let lon = 0, lat = 0;

    window.addEventListener('pointerdown', (e) => {
      if (renderer.xr.isPresenting) return;
      isDragging = true;
      prevX = e.clientX;
      prevY = e.clientY;
    });

    window.addEventListener('pointermove', (e) => {
      if (!isDragging || renderer.xr.isPresenting) return;
      const dx = e.clientX - prevX;
      const dy = e.clientY - prevY;
      prevX = e.clientX;
      prevY = e.clientY;

      lon -= dx * 0.25;
      lat = Math.max(-85, Math.min(85, lat + dy * 0.25));

      const phi = THREE.MathUtils.degToRad(90 - lat);
      const theta = THREE.MathUtils.degToRad(lon);

      const target = new THREE.Vector3();
      target.x = Math.sin(phi) * Math.cos(theta);
      target.y = Math.cos(phi);
      target.z = Math.sin(phi) * Math.sin(theta);
      camera.lookAt(target);
    });

    window.addEventListener('pointerup', () => { isDragging = false; });

    // 5. Native Quest WebXR Launcher
    if ('xr' in navigator) {
      navigator.xr.isSessionSupported('immersive-vr').then((supported) => {
        if (supported) {
          hwVal.textContent = 'Quest VR Available';
          vrBtn.addEventListener('click', async () => {
            if (renderer.xr.isPresenting) {
              renderer.xr.getSession().end();
            } else {
              try {
                const session = await navigator.xr.requestSession('immersive-vr', {
                  optionalFeatures: ['local-floor', 'bounded-floor', 'hand-tracking']
                });
                await renderer.xr.setSession(session);
                vrBtn.textContent = 'EXIT VR';
                statusVal.textContent = 'Active in VR';
              } catch (err) {
                document.getElementById('err-banner').style.display = 'block';
                document.getElementById('err-banner').textContent = 'VR Launch Error: ' + err.message;
              }
            }
          });
        } else {
          hwVal.textContent = 'VR Not Supported on Browser';
          vrBtn.style.display = 'none';
        }
      }).catch(err => {
        hwVal.textContent = 'XR Check Error';
      });
    } else {
      hwVal.textContent = 'WebXR Not Available (Use HTTPS)';
      vrBtn.style.display = 'none';
    }

    // 6. Animation Loop (Smooth Reversal Kinematics)
    let lastTime = performance.now();
    let pingPongPhase = Math.asin(Math.min(Math.max(74.0 / 180.0, -1.0), 1.0));
    let curPinch = 0.0;
    let curSpan = 0.5;

    renderer.setAnimationLoop((timestamp, frame) => {
      const now = performance.now();
      let dt = (now - lastTime) * 0.001;
      lastTime = now;
      if (dt > 0.1) dt = 0.1;

      // Follow camera origin
      skyDome.position.copy(camera.position);

      // Smooth Reversal Kinematics
      const baseAngularSpeed = 32.0;
      const rotSpeedMult = 0.12;
      const omega = (baseAngularSpeed * rotSpeedMult * Math.PI) / 180.0;
      pingPongPhase += omega * dt;
      const currentAngleDeg = 180.0 * Math.sin(pingPongPhase);
      uniforms.u_flow_angle.value = (currentAngleDeg * Math.PI) / 180.0;
      uniforms.u_time.value = timestamp * 0.001;

      // Process Quest Hand / Controller Inputs in VR
      if (renderer.xr.isPresenting) {
        let leftPos = null;
        let rightPos = null;
        let activePinch = 0.0;

        // Optical hands check
        if (hand1 && hand1.joints && hand1.joints['wrist'] && hand2 && hand2.joints && hand2.joints['wrist']) {
          statusVal.textContent = 'Optical Hands Active';
          leftPos = hand1.joints['wrist'].position;
          rightPos = hand2.joints['wrist'].position;

          const idxL = hand1.joints['index-finger-tip'];
          const thmL = hand1.joints['thumb-tip'];
          if (idxL && thmL) {
            const dist = idxL.position.distanceTo(thmL.position);
            activePinch = THREE.MathUtils.clamp(1.0 - (dist - 0.015) / 0.035, 0.0, 1.0);
          }
        } else if (controller1 && controller2) {
          // Touch Controllers
          statusVal.textContent = 'Touch Controllers Active';
          leftPos = controller1.position;
          rightPos = controller2.position;

          const session = renderer.xr.getSession();
          if (session && session.inputSources) {
            for (const s of session.inputSources) {
              if (s.gamepad && s.gamepad.buttons[0]) {
                activePinch = Math.max(activePinch, s.gamepad.buttons[0].value);
              }
            }
          }
        }

        if (leftPos && rightPos) {
          const rawSpan = leftPos.distanceTo(rightPos);
          curSpan += (rawSpan - curSpan) * 0.1;
          const midX = (leftPos.x + rightPos.x) * 0.5;
          const midY = (leftPos.y + rightPos.y) * 0.5;
          uniforms.u_hand_impulse.value.set(midX, midY);
        }

        curPinch += (activePinch - curPinch) * 0.15;
        uniforms.u_pinch_force.value = curPinch;
        uniforms.u_hand_span.value = curSpan;

        spanVal.textContent = curSpan.toFixed(2) + 'm';
        pinchVal.textContent = curPinch.toFixed(2);
      }

      renderer.render(scene, camera);
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
