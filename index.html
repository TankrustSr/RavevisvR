<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Volumetric Contours - Quest 3 WebXR Edition</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      width: 100%;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      display: block;
    }
    #desktop-hud {
      position: absolute;
      top: 18px;
      left: 18px;
      color: rgba(255, 255, 255, 0.9);
      background: rgba(14, 15, 20, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 14px 18px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      pointer-events: none;
      z-index: 10;
      max-width: 340px;
      font-size: 13px;
      line-height: 1.5;
    }
    #desktop-hud h2 {
      margin: 0 0 6px 0;
      font-size: 15px;
      color: #79c0ff;
      letter-spacing: 0.5px;
    }
    #desktop-hud span.val {
      color: #f7a844;
      font-weight: 600;
    }
    /* VR Launch Button Custom Styling */
    #VRButton {
      border: 1px solid rgba(255, 255, 255, 0.3) !important;
      background: rgba(18, 20, 28, 0.9) !important;
      color: #fff !important;
      backdrop-filter: blur(10px) !important;
      font-family: inherit !important;
      font-weight: 700 !important;
      letter-spacing: 1px !important;
      border-radius: 10px !important;
      padding: 12px 24px !important;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5) !important;
      bottom: 24px !important;
    }
  </style>

  <!-- Import maps polyfill for ES module browser loading -->
  <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="desktop-hud">
    <h2>💎 K1 Sacred Chamber (WebXR)</h2>
    Mode: <span class="val">360° Geodesic Dome</span><br>
    Hands: <span id="hand-status" class="val">Searching...</span><br>
    Pinch: <span id="pinch-status" class="val">0.00</span> | Span: <span id="span-status" class="val">0.00m</span><br>
    <div style="font-size: 11px; color: rgba(255,255,255,0.6); margin-top: 8px;">
      Put on your Quest 3 headset and click <b>ENTER VR</b> below. Use hands or controllers to fold space.
    </div>
  </div>

  <div id="canvas-container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { VRButton } from 'three/addons/webxr/VRButton.js';
    import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';
    import { XRHandModelFactory } from 'three/addons/webxr/XRHandModelFactory.js';

    // 1. Scene, Camera, & High-Performance Renderer
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.6, 0); // Average eye-level resting height in meters

    const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
    renderer.setPixelRatio(1.0); // Strict 1.0 DPR locks 72-90 FPS on Snapdragon XR2 Gen 2
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    container.appendChild(renderer.domElement);

    // Attach WebXR Button with Hand Tracking Feature Request
    document.body.appendChild(VRButton.createButton(renderer, {
      requiredFeatures: ['local-floor'],
      optionalFeatures: ['hand-tracking', 'bounded-floor']
    }));

    // 2. Dome Geometry & Shader (Inverted Sphere wrapping the user)
    const domeGeo = new THREE.SphereGeometry(30, 64, 32);
    domeGeo.scale(-1, 1, 1); // Turn sphere inside-out so texture renders around the user

    const vertexShader = `
      varying vec3 vWorldDirection;
      varying vec2 vUv;
      void main() {
        vUv = uv;
        vec4 worldPos = modelMatrix * vec4(position, 1.0);
        vWorldDirection = normalize(worldPos.xyz - cameraPosition);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `;

    const fragmentShader = `
      precision highp float;
      varying vec3 vWorldDirection;
      varying vec2 vUv;

      uniform float u_time;
      uniform float u_flow_angle;
      uniform float u_speed;
      uniform float u_warp_scale;
      uniform float u_flow_stretch;
      uniform float u_kaleido_segs;
      uniform float u_kaleido_angle;
      uniform float u_contour_freq;
      uniform float u_ridge_weight;
      uniform float u_chroma_aberration;
      uniform float u_specular_shimmer;
      uniform float u_rim_glow;
      uniform float u_contrast;

      // VR Dynamic Hand Gestures
      uniform vec2 u_hand_impulse;
      uniform float u_pinch_force;
      uniform float u_hand_span;

      // K1 Color Palette Uniforms
      uniform vec3 u_col_shadow;
      uniform vec3 u_col_cool_a;
      uniform vec3 u_col_cool_b;
      uniform vec3 u_col_warm_a;
      uniform vec3 u_col_warm_b;
      uniform vec3 u_col_crest;

      vec2 hash(vec2 p) {
        p = vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3)));
        return -1.0 + 2.0 * fract(sin(p) * 43758.5453123);
      }

      float noise(vec2 p) {
        const float K1 = 0.366025404;
        const float K2 = 0.211324865;
        vec2 i = floor(p + (p.x + p.y) * K1);
        vec2 a = p - i + (i.x + i.y) * K2;
        vec2 o = (a.x > a.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
        vec2 b = a - o + K2;
        vec2 c = a - 1.0 + 2.0 * K2;
        vec3 h = max(0.5 - vec3(dot(a, a), dot(b, b), dot(c, c)), 0.0);
        vec3 n = h * h * h * h * vec3(dot(a, hash(i + 0.0)), dot(b, hash(i + o)), dot(c, hash(i + 1.0)));
        return dot(n, vec3(70.0));
      }

      float fbm(vec2 p) {
        float f = 0.0;
        float amp = 0.52;
        mat2 rot = mat2(cos(0.26), sin(0.26), -sin(0.26), cos(0.26));
        for (int i = 0; i < 4; i++) { // 4 octaves optimized for Quest 3 VR fill-rate
          f += amp * noise(p);
          p = rot * p * 1.82;
          amp *= 0.52;
        }
        return f;
      }

      vec4 hexCoords(vec2 uv) {
        const vec2 s = vec2(1.0, 1.7320508);
        vec4 hC = floor(vec4(uv, uv - vec2(0.5, 1.0)) / vec4(s, s)) + 0.5;
        vec4 h = vec4(uv - hC.xy * s, uv - (hC.zw + 0.5) * s);
        return dot(h.xy, h.xy) < dot(h.zw, h.zw) ? vec4(h.xy, hC.xy) : vec4(h.zw, hC.zw + 9.73);
      }

      float flowerOfLife(vec2 p) {
        vec4 h = hexCoords(p * 2.2);
        vec2 pCell = h.xy;
        float circleR = 1.0;
        float d1 = abs(length(pCell) - circleR);
        float d2 = abs(length(pCell - vec2(1.0, 0.0)) - circleR);
        float d3 = abs(length(pCell + vec2(1.0, 0.0)) - circleR);
        float d4 = abs(length(pCell - vec2(0.5, 0.866025)) - circleR);
        float d5 = abs(length(pCell + vec2(0.5, 0.866025)) - circleR);
        float d6 = abs(length(pCell - vec2(-0.5, 0.866025)) - circleR);
        float d7 = abs(length(pCell + vec2(-0.5, 0.866025)) - circleR);
        float minD = min(min(min(d1, d2), min(d3, d4)), min(min(d5, d6), d7));
        return 1.0 - smoothstep(0.04, 0.12, minD);
      }

      vec3 rhombilleDiamonds(vec2 p) {
        vec2 s = vec2(1.7320508, 1.0);
        vec2 a = mod(p, s) - s * 0.5;
        vec2 b = mod(p - s * 0.5, s) - s * 0.5;
        vec2 g = dot(a, a) < dot(b, b) ? a : b;
        float angle = atan(g.y, g.x) + 3.14159265;
        float sector = floor(mod(angle / 1.04719755, 6.0));
        float facetID = mod(sector, 3.0);
        vec2 diamondUV = abs(g);
        float dEdge = max(diamondUV.x * 0.5 + diamondUV.y * 0.866025, diamondUV.x);
        float wire = 1.0 - smoothstep(0.44, 0.49, dEdge);
        return vec3(facetID, wire, dEdge);
      }

      void main() {
        // Spherical Ray Projection mapping
        vec3 ray = normalize(vWorldDirection);

        // Map forward view (-Z) directly into the center of the tunnel
        float polarDist = acos(clamp(-ray.z, -1.0, 1.0)); // Angular radius [0 = center, PI = behind]
        float polarAngle = atan(ray.y, ray.x) + u_kaleido_angle;

        // Fold space symmetrically through 6-fold kaleidoscope chamber
        float tau = 6.28318530718;
        float segAngle = tau / u_kaleido_segs;
        float modA = mod(polarAngle, segAngle);
        if (modA < 0.0) modA += segAngle;
        float foldA = abs(modA - segAngle * 0.5); // Bilateral mirror

        // Planar tunnel coordinate
        vec2 st = vec2(cos(foldA), sin(foldA)) * polarDist * 1.4;

        // Apply hand pinch & physical wrist span modulation
        st += u_hand_impulse * 0.4;
        float dynamicStretch = u_flow_stretch * (0.8 + u_hand_span * 0.4);

        float t = u_time * u_speed;
        float rad = u_flow_angle;
        mat2 alignFlow = mat2(cos(rad), sin(rad), -sin(rad), cos(rad));
        vec2 p = alignFlow * st * vec2(0.55, dynamicStretch);

        // Sacred Chamber math
        float radDist = length(p);
        float angleP = atan(p.y, p.x);
        vec2 kDistort = vec2(fbm(p * 1.8 + t * 0.15), fbm(p * 1.8 - t * 0.12)) * (u_warp_scale * 0.22);
        vec2 kp = p + kDistort;

        // 1. Central Geodesic Diamond Dome
        vec3 rBlocks = rhombilleDiamonds(kp * 4.2);
        float centerMask = 1.0 - smoothstep(0.45, 0.85, radDist);
        float facetShade = (rBlocks.x == 0.0) ? 0.95 : (rBlocks.x == 1.0 ? 0.65 : 0.40);

        // 2. Flower of Life & Concentric Lace
        float fol = flowerOfLife(kp * 1.8);
        float ringWaves = abs(sin(radDist * 24.0 - t * 1.2 + sin(angleP * 12.0) * 0.4));
        float chevrons = abs(sin(angleP * 24.0 + radDist * 16.0));
        float beads = 1.0 - smoothstep(0.12, 0.28, length(fract(vec2(angleP * 3.82, radDist * 6.0)) - 0.5));
        float filigreeLace = max(fol * 0.8, chevrons * 0.5) + ringWaves * 0.4 + beads * 0.5;

        float f = mix(filigreeLace, facetShade * 1.2 + rBlocks.y * 0.6, centerMask);
        vec2 r = vec2(cos(angleP), sin(angleP)) * f;

        // Topographical Ridges with Prismatic Splitting
        float freq = u_contour_freq;
        float chroma = u_chroma_aberration * 0.22;
        float ridgeR = abs(sin(f * freq + (r.x + r.y) * 1.5 + chroma));
        float ridgeG = abs(sin(f * freq + (r.x + r.y) * 1.5));
        float ridgeB = abs(sin(f * freq + (r.x + r.y) * 1.5 - chroma));
        vec3 ridges = vec3(smoothstep(0.65, 0.95, ridgeR), smoothstep(0.65, 0.95, ridgeG), smoothstep(0.65, 0.95, ridgeB));
        float bands = smoothstep(0.15, 0.85, sin(f * (freq * 0.45) + r.x * 2.5));

        // Faceted 3D Specular Lighting
        vec3 normalPerturb = vec3(sin(rBlocks.z * 18.0), cos(rBlocks.z * 18.0), 0.0) * centerMask * 0.85;
        vec3 normal = normalize(vec3(-r.x * 1.8, -r.y * 1.8, 0.75) + normalPerturb);
        vec3 lightDir = normalize(vec3(0.35, 0.85, 0.45));
        vec3 viewDir = -ray;
        vec3 halfVec = normalize(lightDir + viewDir);
        float spec = pow(max(dot(normal, halfVec), 0.0), 22.0) * u_specular_shimmer;
        float fresnel = pow(1.0 - max(dot(normal, viewDir), 0.0), 3.0) * u_rim_glow;

        // Color Ramp Harmonization (K1 Preset)
        vec3 col = mix(u_col_shadow, u_col_cool_a, clamp((f * f) * (3.2 * u_contrast), 0.0, 1.0));
        col = mix(col, u_col_cool_b, clamp(length(kDistort) * 0.9 + 0.35, 0.0, 1.0));
        col = mix(col, u_col_warm_b, clamp(r.x * r.x * (2.2 * u_contrast), 0.0, 1.0));
        col = mix(col, u_col_warm_a, clamp(r.y * 1.4, 0.0, 1.0));

        col += (u_col_crest * bands * 0.18) + (ridges * u_col_crest * u_ridge_weight);
        col += u_col_crest * spec * 1.4;
        col += mix(u_col_cool_b, u_col_crest, 0.65) * fresnel;
        col += vec3(0.2, 0.8, 1.0) * u_pinch_force * 0.6; // Interactive touch pinch highlight

        col *= (0.75 + 0.45 * f * u_contrast);

        gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
      }
    `;

    // Uniform Values mapped to your K1 Preset
    const uniforms = {
      u_time:              { value: 0.0 },
      u_flow_angle:        { value: (74.0 * Math.PI) / 180.0 },
      u_speed:             { value: 1.00 },
      u_warp_scale:        { value: 0.90 },
      u_flow_stretch:      { value: 0.35 },
      u_kaleido_segs:      { value: 6.0 },
      u_kaleido_angle:     { value: (30.0 * Math.PI) / 180.0 },
      u_contour_freq:      { value: 22.0 },
      u_ridge_weight:      { value: 0.38 },
      u_chroma_aberration: { value: 0.46 },
      u_specular_shimmer:  { value: 0.85 },
      u_rim_glow:          { value: 0.40 },
      u_contrast:          { value: 1.10 },

      u_hand_impulse:      { value: new THREE.Vector2(0.0, 0.0) },
      u_pinch_force:       { value: 0.0 },
      u_hand_span:         { value: 0.5 },

      u_col_shadow:        { value: new THREE.Color('#1c1412') },
      u_col_cool_a:        { value: new THREE.Color('#7e5234') },
      u_col_cool_b:        { value: new THREE.Color('#df7b6c') },
      u_col_warm_a:        { value: new THREE.Color('#2b7cd4') },
      u_col_warm_b:        { value: new THREE.Color('#4e999b') },
      u_col_crest:         { value: new THREE.Color('#ffffff') }
    };

    const domeMat = new THREE.ShaderMaterial({
      vertexShader: vertexShader,
      fragmentShader: fragmentShader,
      uniforms: uniforms,
      side: THREE.BackSide,
      depthWrite: false
    });

    const skyDome = new THREE.Mesh(domeGeo, domeMat);
    scene.add(skyDome);

    // 3. WebXR Hardware Controllers & Hand Setup
    const controllerModelFactory = new XRControllerModelFactory();
    const handModelFactory = new XRHandModelFactory();

    // Controllers
    const controller1 = renderer.xr.getController(0);
    const controller2 = renderer.xr.getController(1);
    scene.add(controller1);
    scene.add(controller2);

    const controllerGrip1 = renderer.xr.getControllerGrip(0);
    controllerGrip1.add(controllerModelFactory.createControllerModel(controllerGrip1));
    scene.add(controllerGrip1);

    const controllerGrip2 = renderer.xr.getControllerGrip(1);
    controllerGrip2.add(controllerModelFactory.createControllerModel(controllerGrip2));
    scene.add(controllerGrip2);

    // Bare Hands (Optical Tracking)
    const hand1 = renderer.xr.getHand(0);
    hand1.add(handModelFactory.createHandModel(hand1, 'mesh'));
    scene.add(hand1);

    const hand2 = renderer.xr.getHand(1);
    hand2.add(handModelFactory.createHandModel(hand2, 'mesh'));
    scene.add(hand2);

    // HUD Elements
    const hudHandStatus = document.getElementById('hand-status');
    const hudPinchStatus = document.getElementById('pinch-status');
    const hudSpanStatus = document.getElementById('span-status');

    // 4. Kinematics State & Animation Loop
    let lastTime = performance.now();
    let pingPongPhase = Math.asin(Math.min(Math.max(74.0 / 180.0, -1.0), 1.0));
    let curPinch = 0.0;
    let curSpan = 0.5;

    function getPinchDistance(hand) {
      if (!hand || !hand.joints) return 1.0;
      const indexTip = hand.joints['index-finger-tip'];
      const thumbTip = hand.joints['thumb-tip'];
      if (!indexTip || !thumbTip) return 1.0;
      return indexTip.position.distanceTo(thumbTip.position);
    }

    renderer.setAnimationLoop((timestamp, frame) => {
      const now = performance.now();
      let dt = (now - lastTime) * 0.001;
      lastTime = now;
      if (dt > 0.1) dt = 0.1;

      // Keep dome locked to headset position
      skyDome.position.copy(camera.position);

      // Smooth Reversal Kinematics (74° harmonic oscillation)
      const baseAngularSpeed = 32.0;
      const rotSpeedMult = 0.12;
      const omega = (baseAngularSpeed * rotSpeedMult * Math.PI) / 180.0;
      pingPongPhase += omega * dt;
      const currentAngleDeg = 180.0 * Math.sin(pingPongPhase);
      uniforms.u_flow_angle.value = (currentAngleDeg * Math.PI) / 180.0;
      uniforms.u_time.value = timestamp * 0.001;

      // WebXR Hand Tracking & Gesture Processing
      if (renderer.xr.isPresenting) {
        let leftPos = null;
        let rightPos = null;
        let activePinch = 0.0;

        // Check Bare Hands
        if (hand1.joints && hand1.joints['wrist'] && hand2.joints && hand2.joints['wrist']) {
          hudHandStatus.textContent = 'Optical Hands Active';
          leftPos = hand1.joints['wrist'].position;
          rightPos = hand2.joints['wrist'].position;

          const pinchL = getPinchDistance(hand1);
          const pinchR = getPinchDistance(hand2);
          const minPinchDist = Math.min(pinchL, pinchR);
          // Distance < 25mm indicates active pinch
          activePinch = THREE.MathUtils.clamp(1.0 - (minPinchDist - 0.015) / 0.035, 0.0, 1.0);

        } else if (controller1 && controller2) {
          // Fallback to Quest Touch Plus Controllers
          hudHandStatus.textContent = 'Touch Controllers Active';
          leftPos = controller1.position;
          rightPos = controller2.position;

          // Map trigger squeeze
          const session = renderer.xr.getSession();
          if (session && session.inputSources) {
            for (const source of session.inputSources) {
              if (source.gamepad && source.gamepad.buttons[0]) {
                activePinch = Math.max(activePinch, source.gamepad.buttons[0].value);
              }
            }
          }
        }

        if (leftPos && rightPos) {
          const rawSpan = leftPos.distanceTo(rightPos);
          curSpan += (rawSpan - curSpan) * 0.1;

          // Stir space with hand movement
          const midX = (leftPos.x + rightPos.x) * 0.5;
          const midY = (leftPos.y + rightPos.y) * 0.5 - 1.3; // Relative to chest
          uniforms.u_hand_impulse.value.set(midX, midY);
        }

        curPinch += (activePinch - curPinch) * 0.15;
        uniforms.u_pinch_force.value = curPinch;
        uniforms.u_hand_span.value = curSpan;

        hudPinchStatus.textContent = curPinch.toFixed(2);
        hudSpanStatus.textContent = curSpan.toFixed(2) + 'm';
      }

      renderer.render(scene, camera);
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
