<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Volumetric Contours - K1 Fluid Dome (Quest 3)</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #020305;
      width: 100%;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      display: block;
    }
    #ui-hud {
      position: absolute;
      top: 16px;
      left: 16px;
      color: rgba(255, 255, 255, 0.92);
      background: rgba(14, 16, 24, 0.85);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 16px 20px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      pointer-events: none;
      z-index: 10;
      max-width: 320px;
      font-size: 13px;
      line-height: 1.5;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    #ui-hud h2 {
      margin: 0 0 6px 0;
      font-size: 15px;
      color: #79c0ff;
    }
    #ui-hud span.val {
      color: #f7a844;
      font-weight: 600;
    }
    .hud-controls {
      margin-top: 8px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.65);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 8px;
    }
    #vr-btn {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      padding: 14px 32px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #fff;
      background: linear-gradient(135deg, #1c64f2 0%, #00f0ff 100%);
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 240, 255, 0.35);
      cursor: pointer;
      z-index: 100;
      transition: transform 0.1s;
    }
    #vr-btn:active {
      transform: translateX(-50%) scale(0.96);
    }
    #err-banner {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      background: #e02424;
      color: #fff;
      font-size: 12px;
      padding: 8px 16px;
      display: none;
      z-index: 1000;
    }
  </style>

  <!-- Production Three.js UMD -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
</head>
<body>
  <div id="err-banner"></div>

  <div id="ui-hud">
    <h2>💎 K1 Fluid Dome (Quest 3)</h2>
    Mode: <span id="mode-val" class="val">2D Browser Window</span><br>
    Left Hand: <span id="left-val" class="val">Idle</span><br>
    Right Hand: <span id="right-val" class="val">Idle</span>
    <div class="hud-controls">
      • <b>In VR:</b> Move your physical hands to slice and swirl the fluid currents.<br>
      • <b>Index Pinch / Trigger:</b> Radiate luminous capillary ripples and wakes.<br>
      • <b>Harmonic Angle:</b> Oscillates in smooth reversal at 74°.
    </div>
  </div>

  <button id="vr-btn">ENTER VR</button>
  <div id="canvas-container"></div>

  <script>
    window.addEventListener('error', (e) => {
      const banner = document.getElementById('err-banner');
      banner.style.display = 'block';
      banner.textContent = 'Error: ' + e.message;
    });

    const modeVal = document.getElementById('mode-val');
    const leftVal = document.getElementById('left-val');
    const rightVal = document.getElementById('right-val');
    const vrBtn = document.getElementById('vr-btn');

    // 1. Scene & Camera Setup
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 0.1);

    const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
    renderer.setPixelRatio(1.0); // 1.0 DPR locks 90 FPS on Snapdragon XR2
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    container.appendChild(renderer.domElement);

    // 2. Geometry & Analytical Single-Pass Water Shader
    const domeGeo = new THREE.SphereGeometry(60, 48, 24);

    const vertexShader = `
      varying vec3 vDirection;
      void main() {
        vDirection = position;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `;

    const fragmentShader = `
      precision highp float;
      varying vec3 vDirection;

      uniform float u_time;
      uniform float u_flow_angle;
      uniform float u_speed;
      uniform float u_warp_scale;
      uniform float u_flow_stretch;
      uniform float u_kaleido_segs;
      uniform float u_kaleido_angle;
      uniform float u_contour_freq;
      uniform float u_ridge_weight;
      uniform float u_chroma_aberration;
      uniform float u_specular_shimmer;
      uniform float u_rim_glow;
      uniform float u_contrast;
      uniform float u_grain_level;

      // Analytical Hand Interaction Uniforms
      uniform vec2 u_left_pos;
      uniform vec2 u_left_vel;
      uniform float u_left_active;

      uniform vec2 u_right_pos;
      uniform vec2 u_right_vel;
      uniform float u_right_active;

      // K1 Color Palette
      uniform vec3 u_col_shadow;
      uniform vec3 u_col_cool_a;
      uniform vec3 u_col_cool_b;
      uniform vec3 u_col_warm_a;
      uniform vec3 u_col_warm_b;
      uniform vec3 u_col_crest;

      vec2 hash(vec2 p) {
        p = vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3)));
        return -1.0 + 2.0 * fract(sin(p) * 43758.5453123);
      }

      float hash1(vec2 p) {
        return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453);
      }

      float noise(vec2 p) {
        const float K1 = 0.366025404;
        const float K2 = 0.211324865;
        vec2 i = floor(p + (p.x + p.y) * K1);
        vec2 a = p - i + (i.x + i.y) * K2;
        vec2 o = (a.x > a.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
        vec2 b = a - o + K2;
        vec2 c = a - 1.0 + 2.0 * K2;
        vec3 h = max(0.5 - vec3(dot(a, a), dot(b, b), dot(c, c)), 0.0);
        vec3 n = h * h * h * h * vec3(dot(a, hash(i + 0.0)), dot(b, hash(i + o)), dot(c, hash(i + 1.0)));
        return dot(n, vec3(70.0));
      }

      float fbm(vec2 p) {
        float f = 0.0;
        float amp = 0.52;
        mat2 rot = mat2(cos(0.26), sin(0.26), -sin(0.26), cos(0.26));
        for (int i = 0; i < 4; i++) {
          f += amp * noise(p);
          p = rot * p * 1.82;
          amp *= 0.52;
        }
        return f;
      }

      vec4 hexCoords(vec2 uv) {
        const vec2 s = vec2(1.0, 1.7320508);
        vec4 hC = floor(vec4(uv, uv - vec2(0.5, 1.0)) / vec4(s, s)) + 0.5;
        vec4 h = vec4(uv - hC.xy * s, uv - (hC.zw + 0.5) * s);
        return dot(h.xy, h.xy) < dot(h.zw, h.zw) ? vec4(h.xy, hC.xy) : vec4(h.zw, hC.zw + 9.73);
      }

      float flowerOfLife(vec2 p) {
        vec4 h = hexCoords(p * 2.2);
        vec2 pCell = h.xy;
        float circleR = 1.0;
        float d1 = abs(length(pCell) - circleR);
        float d2 = abs(length(pCell - vec2(1.0, 0.0)) - circleR);
        float d3 = abs(length(pCell + vec2(1.0, 0.0)) - circleR);
        float d4 = abs(length(pCell - vec2(0.5, 0.866025)) - circleR);
        float d5 = abs(length(pCell + vec2(0.5, 0.866025)) - circleR);
        float d6 = abs(length(pCell - vec2(-0.5, 0.866025)) - circleR);
        float d7 = abs(length(pCell + vec2(-0.5, 0.866025)) - circleR);
        float minD = min(min(min(d1, d2), min(d3, d4)), min(min(d5, d6), d7));
        return 1.0 - smoothstep(0.04, 0.12, minD);
      }

      vec3 rhombilleDiamonds(vec2 p) {
        vec2 s = vec2(1.7320508, 1.0);
        vec2 a = mod(p, s) - s * 0.5;
        vec2 b = mod(p - s * 0.5, s) - s * 0.5;
        vec2 g = dot(a, a) < dot(b, b) ? a : b;

        float angle = atan(g.y, g.x + 1e-5) + 3.14159265;
        float sector = floor(mod(angle / 1.04719755, 6.0));
        float facetID = mod(sector, 3.0);
        vec2 diamondUV = abs(g);
        float dEdge = max(diamondUV.x * 0.5 + diamondUV.y * 0.866025, diamondUV.x);
        float wire = 1.0 - smoothstep(0.44, 0.49, dEdge);
        return vec3(facetID, wire, dEdge);
      }

      void main() {
        vec3 ray = normalize(vDirection);

        // Pristine 360° Spherical Polar Projection (NO bending / tunnels)
        float polarDist = acos(clamp(-ray.z, -0.9999, 0.9999));
        float polarAngle = atan(ray.y, ray.x + 1e-5) + u_kaleido_angle;

        // 6-Petal Bilateral Kaleidoscope Mirroring
        float tau = 6.28318530718;
        float segAngle = tau / max(u_kaleido_segs, 1.0);
        float modA = mod(polarAngle, segAngle);
        if (modA < 0.0) modA += segAngle;
        float foldA = abs(modA - segAngle * 0.5);

        vec2 st = vec2(cos(foldA), sin(foldA)) * polarDist * 1.4;

        // --- PHYSICAL WATER DISTURBANCES & HAND WAKES ---
        // Left Hand Hydrodynamics
        vec2 toLeft = st - u_left_pos;
        float dL = length(toLeft);
        float forceL = exp(-dL * 2.8) * u_left_active;
        vec2 vortexL = vec2(-toLeft.y, toLeft.x) / (dL + 0.12);
        vec2 wakeL = u_left_vel * exp(-dL * 2.2);
        float rippleL = sin(dL * 28.0 - u_time * 7.5) * exp(-dL * 3.2) * u_left_active;

        // Right Hand Hydrodynamics
        vec2 toRight = st - u_right_pos;
        float dR = length(toRight);
        float forceR = exp(-dR * 2.8) * u_right_active;
        vec2 vortexR = vec2(-toRight.y, toRight.x) / (dR + 0.12);
        vec2 wakeR = u_right_vel * exp(-dR * 2.2);
        float rippleR = sin(dR * 28.0 - u_time * 7.5) * exp(-dR * 3.2) * u_right_active;

        // Displace the coordinate plane with physical wakes and swirls
        st += (vortexL * 0.45 + wakeL * 0.4) * forceL;
        st += (vortexR * 0.45 + wakeR * 0.4) * forceR;

        // Directional Anisotropic Ribbon Alignment
        float t = u_time * u_speed;
        float rad = u_flow_angle;
        mat2 alignFlow = mat2(cos(rad), sin(rad), -sin(rad), cos(rad));
        vec2 p = alignFlow * st * vec2(0.55, u_flow_stretch);

        // Sacred Chamber Geometry
        float radDist = length(p);
        float angleP = atan(p.y, p.x + 1e-5);
        vec2 kDistort = vec2(fbm(p * 1.8 + t * 0.15), fbm(p * 1.8 - t * 0.12)) * (u_warp_scale * 0.22);
        vec2 kp = p + kDistort;

        vec3 rBlocks = rhombilleDiamonds(kp * 4.2);
        float centerMask = 1.0 - smoothstep(0.45, 0.85, radDist);
        float facetShade = (rBlocks.x < 0.5) ? 0.95 : ((rBlocks.x < 1.5) ? 0.65 : 0.40);

        float fol = flowerOfLife(kp * 1.8);
        float ringWaves = abs(sin(radDist * 24.0 - t * 1.2 + sin(angleP * 12.0) * 0.4));
        float chevrons = abs(sin(angleP * 24.0 + radDist * 16.0));
        float beads = 1.0 - smoothstep(0.12, 0.28, length(fract(vec2(angleP * 3.82, radDist * 6.0)) - 0.5));
        float filigreeLace = max(fol * 0.8, chevrons * 0.5) + ringWaves * 0.4 + beads * 0.5;

        float f = mix(filigreeLace, facetShade * 1.2 + rBlocks.y * 0.6, centerMask);
        
        // Inject water ripples directly into the contour density
        f += (rippleL + rippleR) * 0.32;
        vec2 r = vec2(cos(angleP), sin(angleP)) * f;

        // Prismatic Spectral Splitting
        float freq = u_contour_freq;
        float chroma = u_chroma_aberration * 0.22;
        float ridgeR = abs(sin(f * freq + (r.x + r.y) * 1.5 + chroma));
        float ridgeG = abs(sin(f * freq + (r.x + r.y) * 1.5));
        float ridgeB = abs(sin(f * freq + (r.x + r.y) * 1.5 - chroma));
        vec3 ridges = vec3(smoothstep(0.65, 0.95, ridgeR), smoothstep(0.65, 0.95, ridgeG), smoothstep(0.65, 0.95, ridgeB));
        float bands = smoothstep(0.15, 0.85, sin(f * (freq * 0.45) + r.x * 2.5));

        // Faceted 3D Surface Normal Lighting
        vec3 normalPerturb = vec3(sin(rBlocks.z * 18.0), cos(rBlocks.z * 18.0), 0.0) * centerMask * 0.85;
        vec3 normal = normalize(vec3(-r.x * 1.8, -r.y * 1.8, 0.75) + normalPerturb);
        vec3 lightDir = normalize(vec3(0.35, 0.85, 0.45));
        vec3 viewDir = -ray;
        vec3 halfVec = normalize(lightDir + viewDir);

        float spec = pow(max(dot(normal, halfVec), 0.0), 22.0) * u_specular_shimmer;
        float fresnel = pow(clamp(1.0 - max(dot(normal, viewDir), 0.0), 0.0, 1.0), 3.0) * u_rim_glow;

        // Exact K1 Palette Harmonization
        vec3 col = mix(u_col_shadow, u_col_cool_a, clamp((f * f) * (3.2 * u_contrast), 0.0, 1.0));
        col = mix(col, u_col_cool_b, clamp(length(kDistort) * 0.9 + 0.35, 0.0, 1.0));
        col = mix(col, u_col_warm_b, clamp(r.x * r.x * (2.2 * u_contrast), 0.0, 1.0));
        col = mix(col, u_col_warm_a, clamp(r.y * 1.4, 0.0, 1.0));

        col += (u_col_crest * bands * 0.18) + (ridges * u_col_crest * u_ridge_weight);
        col += u_col_crest * spec * 1.4;
        col += mix(u_col_cool_b, u_col_crest, 0.65) * fresnel;

        // Interactive Hand Wake Luminous Highlights
        col += vec3(0.2, 0.85, 1.0) * (forceL + forceR) * 0.55;

        col *= (0.75 + 0.45 * f * u_contrast);

        if (u_grain_level > 0.001) {
          float grain = (hash1(gl_FragCoord.xy + fract(u_time * 0.1)) - 0.5) * u_grain_level;
          col += grain;
        }

        gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
      }
    `;

    const uniforms = {
      u_time:              { value: 0.0 },
      u_flow_angle:        { value: (74.0 * Math.PI) / 180.0 },
      u_speed:             { value: 1.00 },
      u_warp_scale:        { value: 0.90 },
      u_flow_stretch:      { value: 0.35 },
      u_kaleido_segs:      { value: 6.0 },
      u_kaleido_angle:     { value: (30.0 * Math.PI) / 180.0 },
      u_contour_freq:      { value: 22.0 },
      u_ridge_weight:      { value: 0.38 },
      u_chroma_aberration: { value: 0.46 },
      u_specular_shimmer:  { value: 0.85 },
      u_rim_glow:          { value: 0.40 },
      u_contrast:          { value: 1.10 },
      u_grain_level:       { value: 0.03 },

      u_left_pos:          { value: new THREE.Vector2(10.0, 10.0) },
      u_left_vel:          { value: new THREE.Vector2(0.0, 0.0) },
      u_left_active:       { value: 0.0 },

      u_right_pos:         { value: new THREE.Vector2(10.0, 10.0) },
      u_right_vel:         { value: new THREE.Vector2(0.0, 0.0) },
      u_right_active:      { value: 0.0 },

      u_col_shadow:        { value: new THREE.Color('#1c1412') },
      u_col_cool_a:        { value: new THREE.Color('#7e5234') },
      u_col_cool_b:        { value: new THREE.Color('#df7b6c') },
      u_col_warm_a:        { value: new THREE.Color('#2b7cd4') },
      u_col_warm_b:        { value: new THREE.Color('#4e999b') },
      u_col_crest:         { value: new THREE.Color('#ffffff') }
    };

    const domeMat = new THREE.ShaderMaterial({
      vertexShader: vertexShader,
      fragmentShader: fragmentShader,
      uniforms: uniforms,
      side: THREE.DoubleSide,
      depthWrite: false
    });

    const skyDome = new THREE.Mesh(domeGeo, domeMat);
    scene.add(skyDome);

    // 3. VR Controllers & Hand Pointers
    const controller1 = renderer.xr.getController(0);
    const controller2 = renderer.xr.getController(1);
    scene.add(controller1);
    scene.add(controller2);

    const pointerGeo = new THREE.SphereGeometry(0.02, 12, 12);
    const orb1 = new THREE.Mesh(pointerGeo, new THREE.MeshBasicMaterial({ color: 0x00f0ff }));
    const orb2 = new THREE.Mesh(pointerGeo, new THREE.MeshBasicMaterial({ color: 0xffa500 }));
    controller1.add(orb1);
    controller2.add(orb2);

    const hand1 = renderer.xr.getHand ? renderer.xr.getHand(0) : null;
    const hand2 = renderer.xr.getHand ? renderer.xr.getHand(1) : null;
    if (hand1) scene.add(hand1);
    if (hand2) scene.add(hand2);

    // 4. Fallback 2D Mouse/Touch Pointer
    let isMouseDown = false;
    let prevMouseNorm = new THREE.Vector2();

    window.addEventListener('pointerdown', (e) => {
      if (renderer.xr.isPresenting) return;
      isMouseDown = true;
      const x = (e.clientX / window.innerWidth) * 2 - 1;
      const y = -(e.clientY / window.innerHeight) * 2 + 1;
      prevMouseNorm.set(x, y);
      uniforms.u_right_pos.value.set(x, y);
      uniforms.u_right_active.value = 1.0;
    });

    window.addEventListener('pointermove', (e) => {
      if (!isMouseDown || renderer.xr.isPresenting) return;
      const x = (e.clientX / window.innerWidth) * 2 - 1;
      const y = -(e.clientY / window.innerHeight) * 2 + 1;
      const vel = new THREE.Vector2(x - prevMouseNorm.x, y - prevMouseNorm.y).multiplyScalar(15.0);
      prevMouseNorm.set(x, y);
      uniforms.u_right_pos.value.set(x, y);
      uniforms.u_right_vel.value.copy(vel);
    });

    window.addEventListener('pointerup', () => {
      isMouseDown = false;
      uniforms.u_right_active.value = 0.0;
    });

    // 5. Native Quest WebXR Session Launcher
    if ('xr' in navigator) {
      navigator.xr.isSessionSupported('immersive-vr').then((supported) => {
        if (supported) {
          vrBtn.addEventListener('click', async () => {
            if (renderer.xr.isPresenting) {
              renderer.xr.getSession().end();
            } else {
              try {
                const session = await navigator.xr.requestSession('immersive-vr', {
                  optionalFeatures: ['local-floor', 'bounded-floor', 'hand-tracking']
                });
                await renderer.xr.setSession(session);
                vrBtn.textContent = 'EXIT VR';
                modeVal.textContent = 'VR Optical Dome Active';
              } catch (err) {
                document.getElementById('err-banner').style.display = 'block';
                document.getElementById('err-banner').textContent = 'VR Launch Error: ' + err.message;
              }
            }
          });
        } else {
          vrBtn.style.display = 'none';
        }
      });
    }

    // Helper: Map 3D Hand Direction directly to Polar Coordinates
    function mapHandToPolar(handWorldPos) {
      const dir = new THREE.Vector3().subVectors(handWorldPos, camera.position).normalize();
      const polarDist = Math.acos(THREE.MathUtils.clamp(-dir.z, -0.9999, 0.9999));
      let polarAngle = Math.atan2(dir.y, dir.x + 1e-5) + (30.0 * Math.PI) / 180.0;

      const tau = Math.PI * 2.0;
      const segAngle = tau / 6.0;
      let modA = polarAngle % segAngle;
      if (modA < 0.0) modA += segAngle;
      const foldA = Math.abs(modA - segAngle * 0.5);

      return new THREE.Vector2(Math.cos(foldA) * polarDist * 1.4, Math.sin(foldA) * polarDist * 1.4);
    }

    // 6. Kinematics & Animation Loop
    let lastTime = performance.now();
    let pingPongPhase = Math.asin(Math.min(Math.max(74.0 / 180.0, -1.0), 1.0));

    let prevLeftPos = new THREE.Vector2();
    let prevRightPos = new THREE.Vector2();

    renderer.setAnimationLoop((timestamp) => {
      const now = performance.now();
      let dt = (now - lastTime) * 0.001;
      lastTime = now;
      if (dt > 0.1) dt = 0.1;

      // Lock dome to user's head position
      skyDome.position.copy(camera.position);

      // Smooth Reversal Kinematics (74° harmonic oscillation)
      const baseAngularSpeed = 32.0;
      const rotSpeedMult = 0.12;
      const omega = (baseAngularSpeed * rotSpeedMult * Math.PI) / 180.0;
      pingPongPhase += omega * dt;
      const currentAngleDeg = 180.0 * Math.sin(pingPongPhase);
      uniforms.u_flow_angle.value = (currentAngleDeg * Math.PI) / 180.0;
      uniforms.u_time.value = timestamp * 0.001;

      // Hand / Controller Tracking in VR
      if (renderer.xr.isPresenting) {
        let leftWorld = null;
        let rightWorld = null;
        let leftPinch = 0.0;
        let rightPinch = 0.0;

        // Optical hands check
        if (hand1 && hand1.joints && hand1.joints['index-finger-tip']) {
          leftWorld = hand1.joints['index-finger-tip'].position;
          const thmL = hand1.joints['thumb-tip'];
          if (thmL) {
            const dist = leftWorld.distanceTo(thmL.position);
            leftPinch = THREE.MathUtils.clamp(1.0 - (dist - 0.015) / 0.035, 0.0, 1.0);
          }
        }
        if (hand2 && hand2.joints && hand2.joints['index-finger-tip']) {
          rightWorld = hand2.joints['index-finger-tip'].position;
          const thmR = hand2.joints['thumb-tip'];
          if (thmR) {
            const dist = rightWorld.distanceTo(thmR.position);
            rightPinch = THREE.MathUtils.clamp(1.0 - (dist - 0.015) / 0.035, 0.0, 1.0);
          }
        }

        // Controller fallback
        const session = renderer.xr.getSession();
        if (session && session.inputSources) {
          session.inputSources.forEach((s) => {
            if (s.handedness === 'left' && !leftWorld) leftWorld = controller1.position;
            if (s.handedness === 'right' && !rightWorld) rightWorld = controller2.position;

            if (s.gamepad && s.gamepad.buttons) {
              const trigger = s.gamepad.buttons[0] ? s.gamepad.buttons[0].value : 0.0;
              if (s.handedness === 'left') leftPinch = Math.max(leftPinch, trigger);
              if (s.handedness === 'right') rightPinch = Math.max(rightPinch, trigger);
            }
          });
        }

        // Left Hand Projection
        if (leftWorld) {
          const curPolar = mapHandToPolar(leftWorld);
          const vel = new THREE.Vector2().subVectors(curPolar, prevLeftPos).divideScalar(dt + 0.001);
          prevLeftPos.copy(curPolar);

          uniforms.u_left_pos.value.copy(curPolar);
          uniforms.u_left_vel.value.copy(vel);
          uniforms.u_left_active.value = 1.0 + leftPinch * 2.2;
          leftVal.textContent = leftPinch > 0.1 ? 'Pinching Shockwave' : 'Active Flow';
        } else {
          uniforms.u_left_active.value = 0.0;
          leftVal.textContent = 'Idle';
        }

        // Right Hand Projection
        if (rightWorld) {
          const curPolar = mapHandToPolar(rightWorld);
          const vel = new THREE.Vector2().subVectors(curPolar, prevRightPos).divideScalar(dt + 0.001);
          prevRightPos.copy(curPolar);

          uniforms.u_right_pos.value.copy(curPolar);
          uniforms.u_right_vel.value.copy(vel);
          uniforms.u_right_active.value = 1.0 + rightPinch * 2.2;
          rightVal.textContent = rightPinch > 0.1 ? 'Pinching Shockwave' : 'Active Flow';
        } else {
          uniforms.u_right_active.value = 0.0;
          rightVal.textContent = 'Idle';
        }
      }

      // Single, direct render pass straight to the WebXR compositor
      renderer.render(scene, camera);
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
