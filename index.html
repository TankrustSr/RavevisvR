<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Volumetric Contours - K1 Fluid Surface (Quest 3)</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #020305;
      width: 100%;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      display: block;
    }
    #ui-hud {
      position: absolute;
      top: 16px;
      left: 16px;
      color: rgba(255, 255, 255, 0.92);
      background: rgba(14, 16, 24, 0.85);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 16px 20px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      pointer-events: none;
      z-index: 10;
      max-width: 320px;
      font-size: 13px;
      line-height: 1.5;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    #ui-hud h2 {
      margin: 0 0 6px 0;
      font-size: 15px;
      color: #79c0ff;
    }
    #ui-hud span.val {
      color: #f7a844;
      font-weight: 600;
    }
    .hud-controls {
      margin-top: 8px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.65);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 8px;
    }
    #vr-btn {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      padding: 14px 32px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #fff;
      background: linear-gradient(135deg, #1c64f2 0%, #00f0ff 100%);
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 240, 255, 0.35);
      cursor: pointer;
      z-index: 100;
      transition: transform 0.1s;
    }
    #vr-btn:active {
      transform: translateX(-50%) scale(0.96);
    }
    #err-banner {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      background: #e02424;
      color: #fff;
      font-size: 12px;
      padding: 8px 16px;
      display: none;
      z-index: 1000;
    }
  </style>

  <!-- Production Three.js UMD -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
</head>
<body>
  <div id="err-banner"></div>

  <div id="ui-hud">
    <h2>💎 K1 Interactive Water Surface</h2>
    Interaction: <span id="mode-val" class="val">2D Browser Window</span><br>
    Left Hand: <span id="left-val" class="val">Idle</span><br>
    Right Hand: <span id="right-val" class="val">Idle</span>
    <div class="hud-controls">
      • <b>In VR:</b> Reach out to dip your hands or controllers directly into the fluid.<br>
      • <b>Index Pinch / Trigger:</b> Deep splash & luminous shockwave.<br>
      • <b>Grip / Stick Click:</b> Clear fluid canvas.
    </div>
  </div>

  <button id="vr-btn">ENTER VR</button>
  <div id="canvas-container"></div>

  <script>
    window.addEventListener('error', (e) => {
      const banner = document.getElementById('err-banner');
      banner.style.display = 'block';
      banner.textContent = 'VR Error: ' + e.message;
    });

    const modeVal = document.getElementById('mode-val');
    const leftVal = document.getElementById('left-val');
    const rightVal = document.getElementById('right-val');
    const vrBtn = document.getElementById('vr-btn');

    // 1. Scene & VR Camera Setup
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.05, 100);
    camera.position.set(0, 1.3, 0); // Natural seated/standing eye level

    const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
    renderer.setPixelRatio(1.0); // Strict 1.0 DPR for solid 90Hz fill-rate on Quest 3
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    container.appendChild(renderer.domElement);

    // 2. GPGPU Ping-Pong Water Simulation Buffers
    const simRes = 1024;
    const simRT1 = new THREE.WebGLRenderTarget(simRes, simRes, {
      type: THREE.HalfFloatType,
      format: THREE.RGBAFormat,
      minFilter: THREE.LinearFilter,
      magFilter: THREE.LinearFilter
    });
    const simRT2 = simRT1.clone();
    let currentSimRead = simRT1;
    let currentSimWrite = simRT2;

    const simCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    const simScene = new THREE.Scene();
    const simQuadGeo = new THREE.PlaneGeometry(2, 2);

    // Physical Ripple & Wake Advection Shader (From your exact iPad setup)
    const simFS = `
      precision highp float;
      varying vec2 vUv;

      uniform sampler2D u_prevBuffer;
      uniform vec2 u_resolution;
      uniform float u_persistence;
      uniform float u_hand_force;
      uniform float u_ripple_freq;
      uniform float u_time;

      uniform vec2 u_pointer;
      uniform vec2 u_pointer_vel;
      uniform float u_pointer_active;

      uniform vec2 u_left_hand;
      uniform vec2 u_left_vel;
      uniform float u_left_active;

      uniform vec2 u_right_hand;
      uniform vec2 u_right_vel;
      uniform float u_right_active;

      vec2 calcImpulse(vec2 st, vec2 targetPos, vec2 vel, float active, float forceMult) {
        if (active < 0.01) return vec2(0.0);
        vec2 toTarget = st - targetPos;
        float d = length(toTarget);
        vec2 dir = toTarget / (d + 0.001);
        float speed = length(vel);
        float effectiveForce = active * forceMult;

        // Water Wake & Harmonic Capillary Ripples
        float wavePhase = (d * u_ripple_freq) - u_time * 6.5;
        float wave = sin(wavePhase) * exp(-d * 3.4);
        float wake = exp(-d * 2.6);
        float forwardDot = max(dot(dir, vel / (speed + 0.001)), -0.3);

        vec2 impulse = dir * (wave * (0.45 + speed * 2.8)) * effectiveForce;
        impulse += vel * (wake * (0.8 + forwardDot * 0.6)) * effectiveForce;
        return impulse;
      }

      void main() {
        vec2 st = vUv * 2.0 - 1.0;
        vec2 totalImpulse = vec2(0.0);

        totalImpulse += calcImpulse(st, u_pointer, u_pointer_vel, u_pointer_active, 1.2);
        totalImpulse += calcImpulse(st, u_left_hand, u_left_vel, u_left_active, u_hand_force);
        totalImpulse += calcImpulse(st, u_right_hand, u_right_vel, u_right_active, u_hand_force);

        vec2 uvDelta = totalImpulse * 0.007;
        vec2 advectedUV = clamp(vUv - uvDelta, 0.001, 0.999);
        vec2 prevDisp = texture2D(u_prevBuffer, advectedUV).xy;
        vec2 finalDisp = (prevDisp + totalImpulse * 0.25) * u_persistence;

        gl_FragColor = vec4(finalDisp, 0.0, 1.0);
      }
    `;

    const simVS = `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = vec4(position.xy, 0.0, 1.0);
      }
    `;

    const simUniforms = {
      u_prevBuffer:      { value: null },
      u_resolution:      { value: new THREE.Vector2(simRes, simRes) },
      u_persistence:     { value: 0.996 }, // Exact K1 persistence
      u_hand_force:      { value: 1.30 },  // Exact K1 hand force
      u_ripple_freq:     { value: 28.0 },  // Exact K1 ripple frequency
      u_time:            { value: 0.0 },

      u_pointer:         { value: new THREE.Vector2(0.0, 0.0) },
      u_pointer_vel:     { value: new THREE.Vector2(0.0, 0.0) },
      u_pointer_active:  { value: 0.0 },

      u_left_hand:       { value: new THREE.Vector2(0.0, 0.0) },
      u_left_vel:        { value: new THREE.Vector2(0.0, 0.0) },
      u_left_active:     { value: 0.0 },

      u_right_hand:      { value: new THREE.Vector2(0.0, 0.0) },
      u_right_vel:       { value: new THREE.Vector2(0.0, 0.0) },
      u_right_active:    { value: 0.0 }
    };

    const simMat = new THREE.ShaderMaterial({
      vertexShader: simVS,
      fragmentShader: simFS,
      uniforms: simUniforms
    });
    simScene.add(new THREE.Mesh(simQuadGeo, simMat));

    // 3. K1 Sacred Chamber Display Material (Zero Bending / Unwarped Fluid Canvas)
    const displayVS = `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `;

    const displayFS = `
      precision highp float;
      varying vec2 vUv;

      uniform sampler2D u_simTexture;
      uniform float u_time;
      uniform float u_flow_angle;
      uniform float u_speed;
      uniform float u_warp_scale;
      uniform float u_flow_stretch;
      uniform float u_kaleido_segs;
      uniform float u_kaleido_angle;
      uniform float u_contour_freq;
      uniform float u_ridge_weight;
      uniform float u_chroma_aberration;
      uniform float u_specular_shimmer;
      uniform float u_rim_glow;
      uniform float u_contrast;
      uniform float u_grain_level;

      uniform vec3 u_col_shadow;
      uniform vec3 u_col_cool_a;
      uniform vec3 u_col_cool_b;
      uniform vec3 u_col_warm_a;
      uniform vec3 u_col_warm_b;
      uniform vec3 u_col_crest;

      vec2 hash(vec2 p) {
        p = vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3)));
        return -1.0 + 2.0 * fract(sin(p) * 43758.5453123);
      }

      float hash1(vec2 p) {
        return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453);
      }

      float noise(vec2 p) {
        const float K1 = 0.366025404;
        const float K2 = 0.211324865;
        vec2 i = floor(p + (p.x + p.y) * K1);
        vec2 a = p - i + (i.x + i.y) * K2;
        vec2 o = (a.x > a.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
        vec2 b = a - o + K2;
        vec2 c = a - 1.0 + 2.0 * K2;
        vec3 h = max(0.5 - vec3(dot(a, a), dot(b, b), dot(c, c)), 0.0);
        vec3 n = h * h * h * h * vec3(dot(a, hash(i + 0.0)), dot(b, hash(i + o)), dot(c, hash(i + 1.0)));
        return dot(n, vec3(70.0));
      }

      float fbm(vec2 p) {
        float f = 0.0;
        float amp = 0.52;
        mat2 rot = mat2(cos(0.26), sin(0.26), -sin(0.26), cos(0.26));
        for (int i = 0; i < 4; i++) {
          f += amp * noise(p);
          p = rot * p * 1.82;
          amp *= 0.52;
        }
        return f;
      }

      vec4 hexCoords(vec2 uv) {
        const vec2 s = vec2(1.0, 1.7320508);
        vec4 hC = floor(vec4(uv, uv - vec2(0.5, 1.0)) / vec4(s, s)) + 0.5;
        vec4 h = vec4(uv - hC.xy * s, uv - (hC.zw + 0.5) * s);
        return dot(h.xy, h.xy) < dot(h.zw, h.zw) ? vec4(h.xy, hC.xy) : vec4(h.zw, hC.zw + 9.73);
      }

      float flowerOfLife(vec2 p) {
        vec4 h = hexCoords(p * 2.2);
        vec2 pCell = h.xy;
        float circleR = 1.0;
        float d1 = abs(length(pCell) - circleR);
        float d2 = abs(length(pCell - vec2(1.0, 0.0)) - circleR);
        float d3 = abs(length(pCell + vec2(1.0, 0.0)) - circleR);
        float d4 = abs(length(pCell - vec2(0.5, 0.866025)) - circleR);
        float d5 = abs(length(pCell + vec2(0.5, 0.866025)) - circleR);
        float d6 = abs(length(pCell - vec2(-0.5, 0.866025)) - circleR);
        float d7 = abs(length(pCell + vec2(-0.5, 0.866025)) - circleR);
        float minD = min(min(min(d1, d2), min(d3, d4)), min(min(d5, d6), d7));
        return 1.0 - smoothstep(0.04, 0.12, minD);
      }

      vec3 rhombilleDiamonds(vec2 p) {
        vec2 s = vec2(1.7320508, 1.0);
        vec2 a = mod(p, s) - s * 0.5;
        vec2 b = mod(p - s * 0.5, s) - s * 0.5;
        vec2 g = dot(a, a) < dot(b, b) ? a : b;

        float angle = atan(g.y, g.x + 1e-5) + 3.14159265;
        float sector = floor(mod(angle / 1.04719755, 6.0));
        float facetID = mod(sector, 3.0);
        vec2 diamondUV = abs(g);
        float dEdge = max(diamondUV.x * 0.5 + diamondUV.y * 0.866025, diamondUV.x);
        float wire = 1.0 - smoothstep(0.44, 0.49, dEdge);
        return vec3(facetID, wire, dEdge);
      }

      void main() {
        // Pristine Unwarped Planar Coordinates (Centered Aspect Correct)
        vec2 st = (vUv * 2.0 - 1.0) * vec2(1.4, 1.0);
        vec2 centerOffset = vec2(0.0, -0.05);
        vec2 pCentered = st - centerOffset;

        // 6-Petal Kaleidoscope Bilateral Mirror
        float rDist = length(pCentered);
        float pAngle = atan(pCentered.y, pCentered.x + 1e-5) + u_kaleido_angle;
        float tau = 6.28318530718;
        float segAngle = tau / max(u_kaleido_segs, 1.0);
        float modA = mod(pAngle, segAngle);
        if (modA < 0.0) modA += segAngle;
        float foldA = abs(modA - segAngle * 0.5);

        vec2 stFolded = vec2(cos(foldA), sin(foldA)) * rDist;

        // Read physical water fluid displacement from GPGPU simulation
        vec2 waterFlow = texture2D(u_simTexture, vUv).xy;
        stFolded += waterFlow * 0.45;

        // Harmonic Drift & Tensor Flow Alignment
        float t = u_time * u_speed;
        float rad = u_flow_angle;
        mat2 alignFlow = mat2(cos(rad), sin(rad), -sin(rad), cos(rad));
        vec2 p = alignFlow * stFolded * vec2(0.55, u_flow_stretch);

        // Sacred Chamber Archetype
        float radDist = length(p);
        float angleP = atan(p.y, p.x + 1e-5);
        vec2 kDistort = vec2(fbm(p * 1.8 + t * 0.15), fbm(p * 1.8 - t * 0.12)) * (u_warp_scale * 0.22);
        vec2 kp = p + kDistort;

        vec3 rBlocks = rhombilleDiamonds(kp * 4.2);
        float centerMask = 1.0 - smoothstep(0.45, 0.85, radDist);
        float facetShade = (rBlocks.x < 0.5) ? 0.95 : ((rBlocks.x < 1.5) ? 0.65 : 0.40);

        float fol = flowerOfLife(kp * 1.8);
        float ringWaves = abs(sin(radDist * 24.0 - t * 1.2 + sin(angleP * 12.0) * 0.4));
        float chevrons = abs(sin(angleP * 24.0 + radDist * 16.0));
        float beads = 1.0 - smoothstep(0.12, 0.28, length(fract(vec2(angleP * 3.82, radDist * 6.0)) - 0.5));
        float filigreeLace = max(fol * 0.8, chevrons * 0.5) + ringWaves * 0.4 + beads * 0.5;

        float f = mix(filigreeLace, facetShade * 1.2 + rBlocks.y * 0.6, centerMask);
        vec2 r = vec2(cos(angleP), sin(angleP)) * f;

        // Prismatic Spectral Splitting
        float freq = u_contour_freq;
        float chroma = u_chroma_aberration * 0.22;
        float ridgeR = abs(sin(f * freq + (r.x + r.y) * 1.5 + chroma));
        float ridgeG = abs(sin(f * freq + (r.x + r.y) * 1.5));
        float ridgeB = abs(sin(f * freq + (r.x + r.y) * 1.5 - chroma));
        vec3 ridges = vec3(smoothstep(0.65, 0.95, ridgeR), smoothstep(0.65, 0.95, ridgeG), smoothstep(0.65, 0.95, ridgeB));
        float bands = smoothstep(0.15, 0.85, sin(f * (freq * 0.45) + r.x * 2.5));

        // Faceted 3D Surface Normal Lighting
        vec3 normalPerturb = vec3(sin(rBlocks.z * 18.0), cos(rBlocks.z * 18.0), 0.0) * centerMask * 0.85;
        vec3 normal = normalize(vec3(-r.x * 1.8, -r.y * 1.8, 0.75) + normalPerturb);
        vec3 lightDir = normalize(vec3(0.35, 0.85, 0.45));
        vec3 viewDir = vec3(0.0, 0.0, 1.0);
        vec3 halfVec = normalize(lightDir + viewDir);

        float spec = pow(max(dot(normal, halfVec), 0.0), 22.0) * u_specular_shimmer;
        float fresnel = pow(clamp(1.0 - max(dot(normal, viewDir), 0.0), 0.0, 1.0), 3.0) * u_rim_glow;

        // Exact K1 Palette Harmonization
        vec3 col = mix(u_col_shadow, u_col_cool_a, clamp((f * f) * (3.2 * u_contrast), 0.0, 1.0));
        col = mix(col, u_col_cool_b, clamp(length(kDistort) * 0.9 + 0.35, 0.0, 1.0));
        col = mix(col, u_col_warm_b, clamp(r.x * r.x * (2.2 * u_contrast), 0.0, 1.0));
        col = mix(col, u_col_warm_a, clamp(r.y * 1.4, 0.0, 1.0));

        col += (u_col_crest * bands * 0.18) + (ridges * u_col_crest * u_ridge_weight);
        col += u_col_crest * spec * 1.4;
        col += mix(u_col_cool_b, u_col_crest, 0.65) * fresnel;

        // Direct Water Surface Wake Illumination
        col += vec3(0.15, 0.75, 1.0) * length(waterFlow) * 0.6;

        col *= (0.75 + 0.45 * f * u_contrast);

        if (u_grain_level > 0.001) {
          float grain = (hash1(gl_FragCoord.xy + fract(u_time * 0.1)) - 0.5) * u_grain_level;
          col += grain;
        }

        gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
      }
    `;

    const displayUniforms = {
      u_simTexture:        { value: null },
      u_time:              { value: 0.0 },
      u_flow_angle:        { value: (74.0 * Math.PI) / 180.0 },
      u_speed:             { value: 1.00 },
      u_warp_scale:        { value: 0.90 },
      u_flow_stretch:      { value: 0.35 },
      u_kaleido_segs:      { value: 6.0 },
      u_kaleido_angle:     { value: (30.0 * Math.PI) / 180.0 },
      u_contour_freq:      { value: 22.0 },
      u_ridge_weight:      { value: 0.38 },
      u_chroma_aberration: { value: 0.46 },
      u_specular_shimmer:  { value: 0.85 },
      u_rim_glow:          { value: 0.40 },
      u_contrast:          { value: 1.10 },
      u_grain_level:       { value: 0.03 },

      u_col_shadow:        { value: new THREE.Color('#1c1412') },
      u_col_cool_a:        { value: new THREE.Color('#7e5234') },
      u_col_cool_b:        { value: new THREE.Color('#df7b6c') },
      u_col_warm_a:        { value: new THREE.Color('#2b7cd4') },
      u_col_warm_b:        { value: new THREE.Color('#4e999b') },
      u_col_crest:         { value: new THREE.Color('#ffffff') }
    };

    const displayMat = new THREE.ShaderMaterial({
      vertexShader: displayVS,
      fragmentShader: displayFS,
      uniforms: displayUniforms,
      depthWrite: false
    });

    // 4. VR Physical Water Surface (Floating directly in front of the user at arm's length)
    const surfaceWidth = 1.6;
    const surfaceHeight = 1.14; // Aspect ratio 1.4:1
    const waterSurfaceMesh = new THREE.Mesh(new THREE.PlaneGeometry(surfaceWidth, surfaceHeight), displayMat);
    waterSurfaceMesh.position.set(0, 1.3, -0.65); // 65cm in front of eye level
    scene.add(waterSurfaceMesh);

    // Subtle edge boundary glow so you see where the pool exists in 3D space
    const borderGeo = new THREE.EdgesGeometry(new THREE.PlaneGeometry(surfaceWidth, surfaceHeight));
    const borderMat = new THREE.LineBasicMaterial({ color: 0x2b7cd4, transparent: true, opacity: 0.4 });
    waterSurfaceMesh.add(new THREE.LineSegments(borderGeo, borderMat));

    // 5. Quest Controllers & Hand Tracking
    const controller1 = renderer.xr.getController(0);
    const controller2 = renderer.xr.getController(1);
    scene.add(controller1);
    scene.add(controller2);

    const hand1 = renderer.xr.getHand ? renderer.xr.getHand(0) : null;
    const hand2 = renderer.xr.getHand ? renderer.xr.getHand(1) : null;
    if (hand1) scene.add(hand1);
    if (hand2) scene.add(hand2);

    // Visual ripple emitters attached to controller tips
    const fingerOrb1 = new THREE.Mesh(new THREE.SphereGeometry(0.018, 12, 12), new THREE.MeshBasicMaterial({ color: 0x00f0ff }));
    const fingerOrb2 = new THREE.Mesh(new THREE.SphereGeometry(0.018, 12, 12), new THREE.MeshBasicMaterial({ color: 0xffa500 }));
    scene.add(fingerOrb1);
    scene.add(fingerOrb2);
    fingerOrb1.visible = false;
    fingerOrb2.visible = false;

    // 6. 2D Fallback Pointer Interaction (Mouse / Touch)
    let pointerTarget = new THREE.Vector2(0, 0);
    let pointerCur = new THREE.Vector2(0, 0);
    let prevPointer = new THREE.Vector2(0, 0);
    let isMouseDown = false;

    window.addEventListener('pointerdown', (e) => {
      if (renderer.xr.isPresenting) return;
      isMouseDown = true;
      pointerTarget.set((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
      pointerCur.copy(pointerTarget);
      prevPointer.copy(pointerTarget);
    });

    window.addEventListener('pointermove', (e) => {
      if (renderer.xr.isPresenting) return;
      pointerTarget.set((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
    });

    window.addEventListener('pointerup', () => { isMouseDown = false; });

    // 7. WebXR Session Launcher
    if ('xr' in navigator) {
      navigator.xr.isSessionSupported('immersive-vr').then((supported) => {
        if (supported) {
          vrBtn.addEventListener('click', async () => {
            if (renderer.xr.isPresenting) {
              renderer.xr.getSession().end();
            } else {
              try {
                const session = await navigator.xr.requestSession('immersive-vr', {
                  optionalFeatures: ['local-floor', 'bounded-floor', 'hand-tracking']
                });
                await renderer.xr.setSession(session);
                vrBtn.textContent = 'EXIT VR';
                modeVal.textContent = 'VR Water Surface Active';
              } catch (err) {
                document.getElementById('err-banner').style.display = 'block';
                document.getElementById('err-banner').textContent = 'VR Launch Error: ' + err.message;
              }
            }
          });
        } else {
          vrBtn.style.display = 'none';
        }
      });
    }

    // Helper: Map 3D Hand Position to Surface Plane Coordinates & Check Intersection
    const planeInvMatrix = new THREE.Matrix4();
    const tempLocalPos = new THREE.Vector3();

    function getSurfaceContact(worldPos, maxDistance = 0.12) {
      planeInvMatrix.copy(waterSurfaceMesh.matrixWorld).invert();
      tempLocalPos.copy(worldPos).applyMatrix4(planeInvMatrix);

      const halfW = surfaceWidth * 0.5;
      const halfH = surfaceHeight * 0.5;

      // Check if finger is within plane rectangular boundaries
      if (Math.abs(tempLocalPos.x) <= halfW && Math.abs(tempLocalPos.y) <= halfH) {
        const distToSurface = Math.abs(tempLocalPos.z);
        if (distToSurface < maxDistance) {
          // Normalized plane coordinates [-1, 1]
          const normX = tempLocalPos.x / halfW;
          const normY = tempLocalPos.y / halfH;
          // Contact intensity reaches 1.0 on exact surface intersection
          const intensity = 1.0 - (distToSurface / maxDistance);
          return { active: true, x: normX, y: normY, intensity: intensity };
        }
      }
      return { active: false, x: 0, y: 0, intensity: 0 };
    }

    // 8. Kinematics & Simulation Loop
    let lastTime = performance.now();
    let pingPongPhase = Math.asin(Math.min(Math.max(74.0 / 180.0, -1.0), 1.0));

    let prevLeftNorm = new THREE.Vector2();
    let prevRightNorm = new THREE.Vector2();

    renderer.setAnimationLoop((timestamp) => {
      const now = performance.now();
      let dt = (now - lastTime) * 0.001;
      lastTime = now;
      if (dt > 0.1) dt = 0.1;

      // Harmonic 74° Smooth Reversal Kinematics (Matches K1)
      const baseAngularSpeed = 32.0;
      const rotSpeedMult = 0.12;
      const omega = (baseAngularSpeed * rotSpeedMult * Math.PI) / 180.0;
      pingPongPhase += omega * dt;
      const currentAngleDeg = 180.0 * Math.sin(pingPongPhase);
      displayUniforms.u_flow_angle.value = (currentAngleDeg * Math.PI) / 180.0;
      displayUniforms.u_time.value = timestamp * 0.001;
      simUniforms.u_time.value = timestamp * 0.001;

      // 2D Mouse/Touch Fallback
      if (!renderer.xr.isPresenting) {
        pointerCur.lerp(pointerTarget, 0.25);
        const pVel = new THREE.Vector2().subVectors(pointerCur, prevPointer).divideScalar(dt + 0.001);
        prevPointer.copy(pointerCur);

        simUniforms.u_pointer.value.copy(pointerCur);
        simUniforms.u_pointer_vel.value.copy(pVel);
        simUniforms.u_pointer_active.value = isMouseDown ? 1.0 : 0.0;

        fingerOrb1.visible = false;
        fingerOrb2.visible = false;
      } else {
        simUniforms.u_pointer_active.value = 0.0;

        // Process Physical Hand / Controller Interaction on Water Plane
        let leftHandWorld = null;
        let rightHandWorld = null;
        let leftPinch = 0.0;
        let rightPinch = 0.0;

        // 1. Check Optical Hands
        if (hand1 && hand1.joints && hand1.joints['index-finger-tip']) {
          leftHandWorld = hand1.joints['index-finger-tip'].position;
          const thmL = hand1.joints['thumb-tip'];
          if (thmL) {
            const dist = leftHandWorld.distanceTo(thmL.position);
            leftPinch = THREE.MathUtils.clamp(1.0 - (dist - 0.015) / 0.035, 0.0, 1.0);
          }
        }
        if (hand2 && hand2.joints && hand2.joints['index-finger-tip']) {
          rightHandWorld = hand2.joints['index-finger-tip'].position;
          const thmR = hand2.joints['thumb-tip'];
          if (thmR) {
            const dist = rightHandWorld.distanceTo(thmR.position);
            rightPinch = THREE.MathUtils.clamp(1.0 - (dist - 0.015) / 0.035, 0.0, 1.0);
          }
        }

        // 2. Fallback to Touch Controllers
        const session = renderer.xr.getSession();
        if (session && session.inputSources) {
          session.inputSources.forEach((s) => {
            if (s.handedness === 'left' && !leftHandWorld) leftHandWorld = controller1.position;
            if (s.handedness === 'right' && !rightHandWorld) rightHandWorld = controller2.position;

            if (s.gamepad && s.gamepad.buttons) {
              const trigger = s.gamepad.buttons[0] ? s.gamepad.buttons[0].value : 0.0;
              if (s.handedness === 'left') leftPinch = Math.max(leftPinch, trigger);
              if (s.handedness === 'right') rightPinch = Math.max(rightPinch, trigger);

              // Grip / Stick Click clears paint
              const grip = s.gamepad.buttons[1] && s.gamepad.buttons[1].pressed;
              const stick = s.gamepad.buttons[3] && s.gamepad.buttons[3].pressed;
              if (grip || stick) {
                renderer.setRenderTarget(simRT1);
                renderer.clearColor();
                renderer.setRenderTarget(simRT2);
                renderer.clearColor();
              }
            }
          });
        }

        // Left Hand Water Collision
        if (leftHandWorld) {
          const contact = getSurfaceContact(leftHandWorld);
          if (contact.active) {
            const curPos = new THREE.Vector2(contact.x, contact.y);
            const vel = new THREE.Vector2().subVectors(curPos, prevLeftNorm).divideScalar(dt + 0.001);
            prevLeftNorm.copy(curPos);

            simUniforms.u_left_hand.value.copy(curPos);
            simUniforms.u_left_vel.value.copy(vel);
            simUniforms.u_left_active.value = contact.intensity * (1.0 + leftPinch * 1.5);

            fingerOrb1.position.copy(leftHandWorld);
            fingerOrb1.visible = true;
            leftVal.textContent = 'Dipping (' + Math.round(contact.intensity * 100) + '%)';
          } else {
            simUniforms.u_left_active.value = 0.0;
            fingerOrb1.visible = false;
            leftVal.textContent = 'Hovering';
          }
        }

        // Right Hand Water Collision
        if (rightHandWorld) {
          const contact = getSurfaceContact(rightHandWorld);
          if (contact.active) {
            const curPos = new THREE.Vector2(contact.x, contact.y);
            const vel = new THREE.Vector2().subVectors(curPos, prevRightNorm).divideScalar(dt + 0.001);
            prevRightNorm.copy(curPos);

            simUniforms.u_right_hand.value.copy(curPos);
            simUniforms.u_right_vel.value.copy(vel);
            simUniforms.u_right_active.value = contact.intensity * (1.0 + rightPinch * 1.5);

            fingerOrb2.position.copy(rightHandWorld);
            fingerOrb2.visible = true;
            rightVal.textContent = 'Dipping (' + Math.round(contact.intensity * 100) + '%)';
          } else {
            simUniforms.u_right_active.value = 0.0;
            fingerOrb2.visible = false;
            rightVal.textContent = 'Hovering';
          }
        }
      }

      // --- PASS 1: GPGPU Physical Water Simulation ---
      simUniforms.u_prevBuffer.value = currentSimRead.texture;
      renderer.setRenderTarget(currentSimWrite);
      renderer.render(simScene, simCamera);

      // Ping-pong buffer swap
      const temp = currentSimRead;
      currentSimRead = currentSimWrite;
      currentSimWrite = temp;

      // --- PASS 2: Display K1 Sacred Chamber Surface ---
      renderer.setRenderTarget(null);
      displayUniforms.u_simTexture.value = currentSimRead.texture;
      renderer.render(scene, camera);
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
